# Deploys the FULL stack to prod in one run: setup job -> catalog/data -> pipeline.
#
# Why two deploy passes: the pipeline resource references catalog retail_demo,
# which does not exist in a fresh workspace until the setup job creates it.
# Pass 1 creates the job (pipeline may fail - tolerated), the bootstrap step
# runs the job (SQL DDL creates catalog/schemas/volume + seeds data), and
# pass 2 creates the pipeline. On every later push both passes just succeed.
#
# Requires two repository secrets (Settings -> Secrets and variables -> Actions):
#   PROD_HOST   e.g. https://dbc-7a752a54-93ab.cloud.databricks.com
#   PROD_TOKEN  a Databricks PAT for the prod workspace
name: Deploy bundle to prod

on:
  push:
    branches: [main]
  workflow_dispatch: {}   # manual runs from the Actions tab

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DATABRICKS_HOST: ${{ secrets.PROD_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.PROD_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Install Databricks SDK
        run: pip install databricks-sdk

      - name: Deploy pass 1 - create the setup job
        run: databricks bundle deploy -t prod
        continue-on-error: true   # pipeline may fail until the catalog exists

      - name: Bootstrap - run setup job (creates catalog, schemas, volume, seeds data)
        run: python .github/scripts/bootstrap_prod.py

      - name: Deploy pass 2 - create the pipeline
        run: databricks bundle deploy -t prod

      - name: Start pipeline - build bronze/silver/gold in prod
        run: python .github/scripts/start_pipeline.py

