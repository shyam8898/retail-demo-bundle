# Auto-deploys the bundle to PROD on every push to main.
#
# Requires two repository secrets (GitHub -> Settings -> Secrets and variables -> Actions):
#   PROD_HOST   e.g. https://dbc-7a752a54-93ab.cloud.databricks.com
#   PROD_TOKEN  a Databricks PAT for the prod workspace (can create pipelines/jobs/catalogs)
name: Deploy bundle to prod

on:
  push:
    branches: [main]
  workflow_dispatch: {}   # also allows manual runs from the Actions tab

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Deploy to prod
        run: |
          databricks bundle validate -t prod
          databricks bundle deploy -t prod
        env:
          DATABRICKS_HOST: ${{ secrets.PROD_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.PROD_TOKEN }}
